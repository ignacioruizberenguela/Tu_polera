<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrar Productos</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">


</head>

<body class="pagina-admin">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- BARRA LATERAL -->
        <aside class="col-md-3 col-lg-2 bg-dark text-white p-0">

            <div class="p-4">

                <h4 class="mb-4">
                    Tu Polera
                </h4>

                <p class="text-secondary small">
                    PANEL DE ADMINISTRACIÓN
                </p>

                <hr>

                <nav class="nav flex-column">

                    <a href="admin_index.html"
                       class="nav-link text-white mb-2">
                        Inicio
                    </a>

                    <a href="admin_productos.html"
                       class="nav-link active text-white mb-2">
                        Productos
                    </a>

                    <a href="usuarios.html"
                       class="nav-link text-white mb-2">
                        Usuarios
                    </a>

                </nav>

            </div>

            <div class="position-absolute bottom-0 p-4">

                <a href="../index.html"
                   class="btn btn-outline-light">
                    Volver a la tienda
                </a>

            </div>

        </aside>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="col-md-9 col-lg-10 bg-light p-4 p-md-5">

            <!-- ENCABEZADO -->
            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <div>

                    <h1 class="fw-bold">
                        Productos
                    </h1>

                    <p class="text-muted mb-0">
                        Administra los productos de la tienda.
                    </p>

                </div>

                <a href="editar_producto.html"
                   class="btn btn-primary">
                    + Agregar producto
                </a>

            </div>


            <!-- TABLA -->
            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h5 class="card-title mb-4">
                        Lista de productos
                    </h5>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Producto</th>

                                    <th>Precio</th>

                                    <th>Descuento</th>

                                    <th>Datos</th>

                                    <th>Editar</th>

                                </tr>

                            </thead>

                            <tbody id="tablaProductos">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


<script src="js/admin_productos.js"></script>

</body>

</html>
