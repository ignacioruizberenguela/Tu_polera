<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuario - Tu Polera</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="pagina-admin">

<div class="container-fluid">

    <div class="row min-vh-100">

        <aside class="col-md-3 col-lg-2 bg-dark text-white p-0">

            <div class="p-4">

                <h4 class="mb-4">Tu Polera</h4>

                <p class="text-secondary small">
                    PANEL DE ADMINISTRACIÓN
                </p>

                <hr>

                <nav class="nav flex-column">

                    <a
                        href="admin_index.html"
                        class="nav-link text-white mb-2">
                        Inicio
                    </a>

                    <a
                        href="admin_productos.html"
                        class="nav-link text-white mb-2">
                        Productos
                    </a>

                    <a
                        href="admin_usuarios.html"
                        class="nav-link active text-white mb-2">
                        Usuarios
                    </a>

                </nav>

            </div>

            <div class="position-absolute bottom-0 p-4">

                <a
                    href="../index.html"
                    class="btn btn-outline-light">
                    Volver a la tienda
                </a>

            </div>

        </aside>


        <main class="col-md-9 col-lg-10 bg-light p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h1 class="fw-bold" id="tituloPagina">
                        Crear usuario
                    </h1>

                    <p class="text-muted mb-0">
                        Ingresa la información del usuario.
                    </p>

                </div>

                <a
                    href="admin_usuarios.html"
                    class="btn btn-secondary">
                    Volver
                </a>

            </div>


            <div class="card shadow-sm">

                <div class="card-body">

                    <form id="formUsuario">

                        <!-- ID -->

                        <div class="mb-3">

                            <label
                                for="usuarioId"
                                class="form-label">
                                ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="usuarioId"
                                readonly>

                        </div>


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label
                                for="nombre"
                                class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                required>

                            <div
                                id="errorNombre"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- CORREO -->

                        <div class="mb-3">

                            <label
                                for="correo"
                                class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correo"
                                required>

                            <div
                                id="errorCorreo"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- RUT -->

                        <div class="mb-3">

                            <label
                                for="rut"
                                class="form-label">
                                RUT
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="rut"
                                placeholder="12345678-9"
                                required>

                            <div
                                id="errorRut"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- REGION -->

                        <div class="mb-3">

                            <label
                                for="region"
                                class="form-label">
                                Región
                            </label>

                            <select
                                class="form-select"
                                id="region"
                                required>

                                <option value="">
                                    Seleccionar región
                                </option>

                            </select>

                            <div
                                id="errorRegion"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- COMUNA -->

                        <div class="mb-3">

                            <label
                                for="comuna"
                                class="form-label">
                                Comuna
                            </label>

                            <select
                                class="form-select"
                                id="comuna"
                                required
                                disabled>

                                <option value="">
                                    Seleccionar comuna
                                </option>

                            </select>

                            <div
                                id="errorComuna"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- CONTRASEÑA -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                required>

                            <div
                                id="errorPassword"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- ROL -->

                        <div class="mb-3">

                            <label
                                for="rol"
                                class="form-label">
                                Rol
                            </label>

                            <select
                                class="form-select"
                                id="rol"
                                required>

                                <option value="">
                                    Seleccionar rol
                                </option>

                                <option value="cliente">
                                    Cliente
                                </option>

                                <option value="vendedor">
                                    Vendedor
                                </option>

                                <option value="administrador">
                                    Administrador
                                </option>

                            </select>

                            <div
                                id="errorRol"
                                class="invalid-feedback">
                            </div>

                        </div>


                        <!-- BOTONES -->

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Guardar usuario
                            </button>

                            <a
                                href="admin_usuarios.html"
                                class="btn btn-secondary ms-2">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

</div>


<script src="../js/regiones_comunas.js"></script>

<script src="js/admin_editar_usuarios.js"></script>

</body>

</html>
