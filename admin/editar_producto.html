<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto - Tu Polera</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/admin.css">

</head>


<body class="pagina-admin">

<div class="container-fluid">

    <div class="row min-vh-100">


        <!-- BARRA LATERAL -->

        <aside class="col-md-3 col-lg-2 bg-dark text-white p-0">

            <div class="p-4">

                <h4 class="mb-4">
                    Tu Polera
                </h4>

                <p class="text-secondary small">
                    PANEL DE ADMINISTRACIÓN
                </p>

                <hr>

                <nav class="nav flex-column">

                    <a href="admin_index.html"
                       class="nav-link text-white mb-2">

                        Inicio

                    </a>


                    <a href="admin_productos.html"
                       class="nav-link active text-white mb-2">

                        Productos

                    </a>


                    <a href="usuarios.html"
                       class="nav-link text-white mb-2">

                        Usuarios

                    </a>

                </nav>

            </div>


            <div class="position-absolute bottom-0 p-4">

                <a href="../index.html"
                   class="btn btn-outline-light">

                    Volver a la tienda

                </a>

            </div>

        </aside>



        <!-- CONTENIDO PRINCIPAL -->

        <main class="col-md-9 col-lg-10 bg-light p-4 p-md-5">


            <!-- ENCABEZADO -->

            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <div>

                    <h1 class="fw-bold" id="tituloPagina">

                        Editar producto

                    </h1>

                    <p class="text-muted mb-0">

                        Modifica la información del producto.

                    </p>

                </div>


                <a href="admin_productos.html"
                   class="btn btn-secondary">

                    Volver

                </a>

            </div>



            <!-- FORMULARIO -->

<div class="container-fluid">

    <div class="row">

        <!-- CONTENIDO -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">

            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">

                <h1 class="h2">
                    Editar producto
                </h1>

            </div>


            <!-- FORMULARIO -->
            <div class="card shadow-sm">
            
                <div class="card-body">
                
                    <form id="formProducto">
                    
                    
                        <!-- NOMBRE -->
                        <div class="mb-3">
                        
                            <label for="nombre" class="form-label">
                                Nombre del producto
                            </label>
                        
                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                required>
                        
                        </div>
                    
                    
                        <!-- CATEGORÍA -->
                        <div class="mb-3">
                        
                            <label for="categoria" class="form-label">
                                Categoría
                            </label>
                        
                            <select
                                class="form-select"
                                id="categoria"
                                required>
                        
                                <option value="">
                                    Seleccionar categoría
                                </option>
                            
                                <option value="poleras">
                                    Poleras
                                </option>
                            
                                <option value="polerones">
                                    Polerones
                                </option>
                            
                                <option value="gorras">
                                    Gorras
                                </option>
                            
                            </select>
                        
                        </div>
                    
                    
                        <!-- PRECIO -->
                        <div class="mb-3">
                        
                            <label for="precio" class="form-label">
                                Precio
                            </label>
                        
                            <input
                                type="number"
                                class="form-control"
                                id="precio"
                                min="0"
                                required>
                        
                        </div>
                    
                    
                        <!-- COLOR -->
                        <div class="mb-3">
                        
                            <label for="color" class="form-label">
                                Color
                            </label>
                        
                            <input
                                type="text"
                                class="form-control"
                                id="color"
                                required>
                        
                        </div>
                    
                    
                        <!-- DESCUENTO -->
                        <div class="mb-3">
                        
                            <label for="descuento" class="form-label">
                                Descuento (%)
                            </label>
                        
                            <input
                                type="number"
                                class="form-control"
                                id="descuento"
                                min="0"
                                max="100"
                                value="0"
                                required>
                        
                        </div>
                    
                    
                        <!-- TALLAS -->
                        <div class="mb-3">
                        
                            <label class="form-label">
                                Tallas
                            </label>
                        
                            <div>
                            
                                <div class="form-check form-check-inline">
                                
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="tallas"
                                        id="tallaS"
                                        value="S">
                                
                                    <label
                                        class="form-check-label"
                                        for="tallaS">
                                        S
                                    </label>
                                
                                </div>
                            
                            
                                <div class="form-check form-check-inline">
                                
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="tallas"
                                        id="tallaM"
                                        value="M">
                                
                                    <label
                                        class="form-check-label"
                                        for="tallaM">
                                        M
                                    </label>
                                
                                </div>
                            
                            
                                <div class="form-check form-check-inline">
                                
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="tallas"
                                        id="tallaL"
                                        value="L">
                                
                                    <label
                                        class="form-check-label"
                                        for="tallaL">
                                        L
                                    </label>
                                
                                </div>
                            
                            
                                <div class="form-check form-check-inline">
                                
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="tallas"
                                        id="tallaXL"
                                        value="XL">
                                
                                    <label
                                        class="form-check-label"
                                        for="tallaXL">
                                        XL
                                    </label>
                                
                                </div>
                            
                            </div>
                        
                        </div>
                    
                    
                        <!-- MANGA CORTA -->
                        <div
                            class="mb-3"
                            id="campoMangaCorta">
                    
                            <label
                                for="mangaCorta"
                                class="form-label">
                    
                                ¿Manga corta?
                    
                            </label>
                        
                            <select
                                class="form-select"
                                id="mangaCorta">
                        
                                <option value="si">
                                    Sí
                                </option>
                            
                                <option value="no">
                                    No
                                </option>
                            
                            </select>
                        
                        </div>
                    
                    
                        <!-- CAPUCHA -->
                        <div
                            class="mb-3"
                            id="campoCapucha">
                    
                            <label
                                for="capucha"
                                class="form-label">
                    
                                ¿Tiene capucha?
                    
                            </label>
                        
                            <select
                                class="form-select"
                                id="capucha">
                        
                                <option value="si">
                                    Sí
                                </option>
                            
                                <option value="no">
                                    No
                                </option>
                            
                            </select>
                        
                        </div>
                    
                    
                        <!-- TIPO DE GORRO -->
                        <div
                            class="mb-3"
                            id="campoTipoGorro">
                    
                            <label
                                for="tipoGorro"
                                class="form-label">
                    
                                Tipo de gorro
                    
                            </label>
                        
                            <input
                                type="text"
                                class="form-control"
                                id="tipoGorro"
                                placeholder="Ej: Snapback">
                        
                        </div>
                    
                    
                        <!-- IMAGEN -->
                        <div class="mb-3">
                        
                            <label
                                for="imagen"
                                class="form-label">
                        
                                Imagen
                        
                            </label>
                        
                            <select
                                class="form-select"
                                id="imagen"
                                required>
                        
                                <option value="">
                                    Seleccionar imagen
                                </option>
                            
                                <option value="Imagenes/imagen1.png">
                                    Imagen 1
                                </option>
                            
                                <option value="Imagenes/imagen2.png">
                                    Imagen 2
                                </option>
                            
                                <option value="Imagenes/imagen3.png">
                                    Imagen 3
                                </option>
                            
                                <option value="Imagenes/imagen5.png">
                                    Imagen 5
                                </option>
                            
                            </select>
                        
                        </div>
                    
                    
                        <!-- DESCRIPCIÓN -->
                        <div class="mb-3">
                        
                            <label
                                for="descripcion"
                                class="form-label">
                        
                                Descripción
                        
                            </label>
                        
                            <textarea
                                class="form-control"
                                id="descripcion"
                                rows="4"
                                required></textarea>
                        
                        </div>
                    
                    
                        <!-- BOTONES -->
                        <div class="mt-4">
                        
                            <button
                                type="submit"
                                class="btn btn-primary">
                        
                                Guardar cambios
                        
                            </button>
                        
                        
                            <a
                                href="admin_productos.html"
                                class="btn btn-secondary ms-2">
                        
                                Cancelar
                        
                            </a>
                        
                        </div>
                    
                    
                    </form>
                
                </div>
            
            </div>
        
        </main>
    
    </div>

</div>


<script src="js/editar_producto.js"></script>

</body>

</html>
