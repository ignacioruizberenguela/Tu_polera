<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="registro-card">
    <h2>Crear Cuenta</h2>
    <p>Ingresa tus datos para registrarte</p>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
      </div>
      <div class="form-group">
        <label for="rut">Rut</label>
        <input type="text" id="rut" placeholder="12.345.678-9" required>
      </div>
      <!-- Selector de Región -->
<div class="mb-3">
  <label for="region" class="form-label">Seleccione Región</label>
  <select id="region" class="form-select" required>
    <option value="" selected disabled>-- Seleccione una región --</option>
  </select>
</div>

<!-- Selector de Comuna -->
<div class="mb-3">
  <label for="region" class="form-label">Seleccione Región</label>
  <select id="region" class="form-select" required>
    <option value="" selected disabled>-- Seleccione una región --</option>
  </select>
</div>

<div class="mb-3">
  <label for="comuna" class="form-label">Seleccione Comuna</label>
  <select id="comuna" class="form-select" required disabled>
    <option value="" selected disabled>-- Seleccione primero una región --</option>
  </select>
</div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" required>
      </div>
     
      <div class="form-check">
        <input type="checkbox" id="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div class="login-link">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </div>
  </div>

</body>
</html>
