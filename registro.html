<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-registro">

    <div class="registro-container">

        <h2>Crear Cuenta</h2>

        <p>Ingresa tus datos para registrarte</p>

        <form>

            <label for="nombre">Nombre completo</label>
            <input 
                type="text" 
                id="nombre" 
                placeholder="Juan Pérez">

            <label for="correo">Correo electrónico</label>
            <input 
                type="email" 
                id="correo" 
                placeholder="nombre@ejemplo.com">

            <label for="rut">Rut</label>
            <input 
                type="text" 
                id="rut" 
                placeholder="20.213.017-8">

            <label for="region">Seleccione Región</label>
            <select id="region">
                <option>Seleccione una región</option>
            </select>

            <label for="comuna">Seleccione Comuna</label>
            <select id="comuna">
                <option>Seleccione primero una región</option>
            </select>

            <label for="password">Contraseña</label>
            <input 
                type="password" 
                id="password">

            <label for="confirmar">Confirmar contraseña</label>
            <input 
                type="password" 
                id="confirmar">

            <label class="terminos">
                <input type="checkbox">
                Acepto los términos y condiciones
            </label>

            <button 
                type="submit" 
                class="btn-registrar">
                Registrarse
            </button>

            <div class="iniciar-sesion">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </div>

        </form>

    </div>

  <script src="js/regiones.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
