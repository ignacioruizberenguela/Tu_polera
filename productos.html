<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Tu polera
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">
                            Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html">
                            Blogs
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">
                            Registrarse
                        </a>
                    </li>

                </ul>

                <a href="carrito.html"
                   class="btn btn-outline-light ms-3">
                    🛒 Carrito
                </a>

            </div>

        </div>

    </nav>


    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <section class="container py-5">

            <h1 class="text-center mb-5">
                Nuestros productos
            </h1>


            <!-- FILTROS -->

            <div class="row g-4">

                <div class="col-12 col-md-6 col-lg-4">

                    <label
                        for="filtroTipo"
                        class="form-label">

                        Tipo

                    </label>

                    <select
                        id="filtroTipo"
                        class="form-select">

                        <option value="todos">
                            Todos
                        </option>

                        <option value="poleras">
                            Poleras
                        </option>

                        <option value="polerones">
                            Polerones
                        </option>

                        <option value="gorras">
                            Gorras
                        </option>

                    </select>

                </div>


                <div class="col-12 col-md-6 col-lg-4">

                    <label
                        for="filtroColor"
                        class="form-label">

                        Color

                    </label>

                    <select
                        id="filtroColor"
                        class="form-select">

                        <option value="todos">
                            Todos
                        </option>

                        <option value="negro">
                            Negro
                        </option>

                        <option value="rojo">
                            Rojo
                        </option>

                        <option value="amarillo">
                            Amarillo
                        </option>

                    </select>

                </div>


                <div class="col-12 col-md-6 col-lg-4">

                    <label
                        for="filtroDescuento"
                        class="form-label">

                        Rango de Descuentos

                    </label>

                    <select
                        id="filtroDescuento"
                        class="form-select">

                        <option value="todos">
                            Todos
                        </option>

                        <option value="0">
                            Sin descuento
                        </option>

                        <option value="25">
                            25% o más
                        </option>

                        <option value="50">
                            50% o más
                        </option>

                        <option value="90">
                            90% o más
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRODUCTOS -->

            <div
                id="contenedorProductos"
                class="row g-4 mt-2">

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 - Tu polera
        </p>

    </footer>


    <!-- MODAL PRODUCTO -->

    <div class="modal fade" id="modalProducto" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modalNombre">
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="modal-imagen-contenedor">

                        <img
                            id="modalImagen"
                            src=""
                            alt="">

                    </div>

                    <p
                        id="modalDescripcion"
                        class="mt-3">
                    </p>

                    <p
                        id="modalPrecio"
                        class="fw-bold">
                    </p>

                    <div class="mb-3">

                        <label
                            for="modalTalla"
                            class="form-label">
                            Talla
                        </label>

                        <select
                            id="modalTalla"
                            class="form-select">
                        </select>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>

                    <button
                        type="button"
                        id="btnAgregarCarrito"
                        class="btn btn-dark">
                        Añadir al carrito
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Javascript -->

    <script src="js/productos.js"></script>

</body>

</html>
