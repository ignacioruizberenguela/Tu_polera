<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda con Bootstrap</title>

  <!-- 1. Enlace al CSS de Bootstrap -->
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">

  <style>
    /* Estilos generales de la barra superior */
    .top-bar {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 13px;
      padding: 8px 20px;

      /* Flexbox para distribuir izquierda, centro y derecha */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Estilos de las secciones internas */
    .top-bar-left,
    .top-bar-right {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    /* Estilos de los enlaces */
    .top-bar a {
      color: #cccccc;
      text-decoration: none;
      transition: color 0.2s;
    }

    .top-bar a:hover {
      color: #ffffff;
    }

    /* Selectores de idioma / moneda */
    .top-bar select {
      background: transparent;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 3px;
      font-size: 12px;
      padding: 2px 4px;
      cursor: pointer;
    }

    .top-bar select option {
      background-color: #1a1a1a;
      color: #ffffff;
    }

    /* Mensaje central destacado */
    .top-bar-center {
      font-weight: bold;
      color: #ffc107;
    }
  </style>

</head>
<body>

  <!-- Tu contenido HTML con clases de Bootstrap -->
  <div class="container mt-4">
    <div class="alert alert-success" role="alert">
      ¡Bootstrap local cargado correctamente!
    </div>

    <button class="btn btn-primary">Boton de prueba</button>
  </div>
  <div class="top-bar">
      
      <div class="top-bar-left">
        <span>📞 Ayuda: +56 9 1234 5678</span>
        <a href="#seguimiento">Sigue tu pedido</a>
      </div>

      <div class="top-bar-center">
        🚚 Envío GRATIS en compras sobre $50.000
      </div>

      <div class="top-bar-right">
        <select aria-label="Seleccionar idioma">
          <option value="es">ES</option>
          <option value="en">EN</option>
        </select>

        <select aria-label="Seleccionar moneda">
          <option value="clp">CLP ($)</option>
          <option value="usd">USD ($)</option>
        </select>

        <a href="#login">Iniciar Sesión</a>
      </div>

  <!-- 2. Enlace al JS de Bootstrap (usa "bundle" para incluir Popper.js) -->
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
